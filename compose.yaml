name: svaar

x-application: &application
  image: svaar:local
  build: .
  environment: &infrastructure-environment
    SVAAR_ENVIRONMENT: ${SVAAR_ENVIRONMENT:-development}
    SVAAR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-svaar}:${POSTGRES_PASSWORD:-svaar_dev_only}@db:5432/${POSTGRES_DB:-svaar}
    SVAAR_LOG_LEVEL: ${SVAAR_LOG_LEVEL:-INFO}
    SVAAR_DATABASE_TIMEOUT_SECONDS: ${SVAAR_DATABASE_TIMEOUT_SECONDS:-3}

x-agent-environment: &agent-environment
  <<: *infrastructure-environment
  SVAAR_CONFIRMATION_TTL_SECONDS: ${SVAAR_CONFIRMATION_TTL_SECONDS:-600}
  SVAAR_CONFIRMATION_MAX_ATTEMPTS: ${SVAAR_CONFIRMATION_MAX_ATTEMPTS:-5}
  SVAAR_ALLOW_SAME_CHANNEL_CONFIRMATION: ${SVAAR_ALLOW_SAME_CHANNEL_CONFIRMATION:-false}
  SVAAR_POLICY_HIGH: ${SVAAR_POLICY_HIGH:-0.85}
  SVAAR_POLICY_LOW: ${SVAAR_POLICY_LOW:-0.55}
  SVAAR_LLM_BASE_URL: ${SVAAR_LLM_BASE_URL:-}
  SVAAR_LLM_API_KEY: ${SVAAR_LLM_API_KEY:-}
  SVAAR_LLM_MODEL: ${SVAAR_LLM_MODEL:-}

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-svaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-svaar_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-svaar}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *application
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *application
    environment:
      <<: *agent-environment
      # Operator routes only; empty means operator routes answer 503.
      SVAAR_OPERATOR_TOKEN: ${SVAAR_OPERATOR_TOKEN:-}
      SVAAR_INVITE_TTL_HOURS: ${SVAAR_INVITE_TTL_HOURS:-72}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Reserved for the agent runtime. Default startup explicitly refuses to idle
  # without a listener; --check validates infrastructure without starting one.
  gateway:
    <<: *application
    environment: *agent-environment
    profiles: ["gateway"]
    init: true
    entrypoint: ["python", "-m", "svaar.gateway"]
    command: []
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
