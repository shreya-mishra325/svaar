name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: svaar
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: svaar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U svaar -d svaar_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SVAAR_ENVIRONMENT: test
      SVAAR_DATABASE_URL: postgresql+psycopg://svaar:ci_only@localhost:5432/svaar_test
      SVAAR_TEST_DATABASE_URL: postgresql+psycopg://svaar:ci_only@localhost:5432/svaar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.11.29
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked alembic check
      - run: uv run --locked python -m svaar.gateway --check
      - run: uv run --locked pytest
      - run: docker compose config --quiet
      - run: docker compose --profile gateway --profile ci config --quiet
      - run: uv run --locked python -m svaar.deployment --source .env.example --output .env.demo
      - run: docker compose --env-file .env.demo -f compose.demo.yaml --profile public --profile chat --profile ci config --quiet
